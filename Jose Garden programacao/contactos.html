                <li class="list active">
                    <a href="contactos.html">
                        <span class="icon">
                            <i class="fa-solid fa-phone"></i>

                </li>
                <li class="list">

                    </a>
                </li>
            </ul>
            <div class="indicator"></div>
        </div>
        <div class="home">
            <h1>Contactos</h1>
            <section class="contactos-diretos" aria-labelledby="titulo-contactos-diretos">
                <h2 id="titulo-contactos-diretos">Contactos diretos</h2>
                <div class="contactos-diretos-lista">
                    <div class="contacto-direto">
                        <i class="fa-solid fa-mobile-screen-button" aria-hidden="true"></i>
                        <div>
                            <h3>Telemóvel</h3>
                            <p>A adicionar brevemente</p>
                        </div>
                    </div>
                    <div class="contacto-direto">
                        <i class="fa-solid fa-envelope" aria-hidden="true"></i>
                        <div>
                            <h3>Email</h3>
                            <p>A adicionar brevemente</p>
                        </div>
                    </div>
                </div>
            </section>
            <section class="formulario-secao">
                <h2>📌 Entre em Contacto</h2>
                <form id="formContacto" class="form-contacto">
                    <div class="form-grupo">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" required>
                        <span class="erro" id="erroNome"></span>
                    </div>

                    <div class="form-grupo">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                        <span class="erro" id="erroEmail"></span>
                    </div>

                    <div class="form-grupo">
                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" name="telefone">
                        <span class="erro" id="erroTelefone"></span>
                    </div>

                    <div class="form-grupo">
                        <label for="assunto">Assunto:</label>
                        <input type="text" id="assunto" name="assunto" required>
                        <span class="erro" id="erroAssunto"></span>
                    </div>

                    <div class="form-grupo">
                        <label for="mensagem">Mensagem:</label>
                        <textarea id="mensagem" name="mensagem" rows="6" required></textarea>
                        <span class="erro" id="erroMensagem"></span>
                    </div>

                    <button type="submit" class="btn-enviar">Enviar Mensagem</button>
                    <p id="mensagemSucesso" class="mensagem-sucesso"></p>
                </form>
            </section>
            <style>
                h1{ color: #e2e6e9;
                margin-left: 100px;
            }
                body {
                    background-image: url('imagens/Fundo\ contactos.jpg'); /* Caminho da imagem */
                    background-size:cover; /* Ajusta a imagem para cobrir toda a tela */
                    background-repeat: no-repeat; /* Evita repetição da imagem */
                    background: position 200px; /* Centraliza a imagem */
                }
            </style>
        </div>
